root = "."
tmp_dir = "temp/air-http"

[build]
  # Entry stays on cmd/hello until cmd/http lands in the next commit.
  cmd = "go build -o ./temp/air-http/app ./cmd/hello"
  entrypoint = ["./temp/air-http/app"]
  include_ext = ["go", "sql"]
  exclude_dir = ["temp", "bin", "docs", "deployments", "mocks", ".git", ".github", ".idea", ".claude"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "5s"
  send_interrupt = true
  stop_on_error = true
  rerun = true
  rerun_delay = 5000

[log]
  time = true

[misc]
  clean_on_exit = true
