version: 3

allow:
  depOnAnyVendor: true
  deepScan: false

excludeFiles:
  - "_test\\.go$"

commonComponents:
  - shared

components:
  domain:         { in: "internal/domain/**" }
  app:            { in: "internal/app/**" }
  infrastructure: { in: "internal/infrastructure/**" }
  presentation:   { in: "internal/presentation/**" }
  shared:         { in: "pkg/**" }
  config:         { in: "config/**" }
  docs:           { in: "docs/**" }
  entrypoint:     { in: "cmd/**" }
  testutils:      { in: "internal/testutils/**" }

deps:
  domain:
    mayDependOn: [ domain ]
  app:
    mayDependOn: [ domain, app ]
  config:
    mayDependOn: [ domain, infrastructure ]
  infrastructure:
    mayDependOn: [ domain, app, infrastructure ]
  presentation:
    mayDependOn: [ domain, app, presentation ]
  shared:
    mayDependOn: [ shared ]
  testutils:
    mayDependOn: [ shared ]
  entrypoint:
    mayDependOn: [ domain, app, infrastructure, presentation, config, docs, entrypoint ]
