version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|package-comments):"

formatters:
  enable:
    - gofmt
    - goimports
