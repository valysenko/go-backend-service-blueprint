services:
  kafka:
    image: confluentinc/cp-kafka:7.8.6
    hostname: blueprint-kafka
    container_name: blueprint-kafka
    ports: ["19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@blueprint-kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://blueprint-kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks: [blueprint-network]
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.8
    hostname: blueprint-schema-registry
    ports: ["18081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: blueprint-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: blueprint-kafka:29092
    depends_on: [kafka]
    networks: [blueprint-network]
  kafka-console:
    image: redpandadata/console:v2.8.7
    ports: ["18080:8080"]
    environment:
      KAFKA_BROKERS: blueprint-kafka:29092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://blueprint-schema-registry:8081
    depends_on: [kafka, schema-registry]
    networks: [blueprint-network]
