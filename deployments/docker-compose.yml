services:
  app:
    restart: always
    tty: true
    container_name: blueprint-app
    hostname: blueprint-app
    build:
      target: dev
      context: ../
      dockerfile: deployments/app/Dockerfile
    working_dir: /src
    command: ["air", "-c", ".air.http.toml"]
    volumes:
      - ../:/src
      - blueprint-go-mod:/go/pkg/mod
      - blueprint-go-build:/root/.cache/go-build
    ports:
      - "8096:8096"
      # delve
      - "40000:40000"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis
    networks:
      - blueprint-network

  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: blueprint-rabbitmq
    hostname: blueprint-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-blueprint}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-blueprint}
    ports:
      - "15696:15672"
      - "56796:5672"
    networks:
      - blueprint-network
    profiles: ["rabbitmq"]

  rabbitmq-consumer:
    build:
      target: dev
      context: ../
      dockerfile: deployments/app/Dockerfile
    working_dir: /src
    command: ["air", "-c", ".air.rabbitmq.toml"]
    restart: always
    volumes:
      - ../:/src
      - blueprint-go-mod:/go/pkg/mod
      - blueprint-go-build:/root/.cache/go-build
    ports: ["8099:8099"]
    env_file:
      - path: .env
        required: false
    depends_on: [rabbitmq, redis]
    networks:
      - blueprint-network
    profiles: ["rabbitmq"]

  postgres:
    image: postgres:17.2-alpine
    container_name: blueprint-postgres
    hostname: blueprint-postgres
    restart: always
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    ports:
      - "15435:5432"
    volumes:
      - blueprint-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - blueprint-network

  redis:
    image: redis:8.4-alpine
    container_name: blueprint-redis
    hostname: blueprint-redis
    restart: always
    ports:
      - "63796:6379"
    volumes:
      - blueprint-redis-data:/data
    networks:
      - blueprint-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: blueprint-redis-insight
    restart: always
    ports:
      - "5546:5540"
    environment:
      RI_REDIS_HOST_LOCAL: blueprint-redis
      RI_REDIS_PORT_LOCAL: 6379
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    volumes:
      - blueprint-redis-insight-data:/data
    depends_on:
      - redis
    networks:
      - blueprint-network

volumes:
  blueprint-go-mod:
  blueprint-go-build:
  blueprint-postgres-data:
  blueprint-redis-data:
  blueprint-redis-insight-data:

networks:
  blueprint-network:
    name: blueprint-network
