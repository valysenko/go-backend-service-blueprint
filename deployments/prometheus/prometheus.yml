global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: http-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8096"]

  - job_name: pushgateway-metrics
    honor_timestamps: true
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
