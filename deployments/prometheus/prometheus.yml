global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: http-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["blueprint-app:8096"]

  - job_name: kafka-user-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-user:8097"]

  - job_name: kafka-events-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-events:8097"]

  - job_name: rabbitmq-consumer-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq-consumer:8099"]

  - job_name: pushgateway-metrics
    honor_timestamps: true
    metrics_path: /metrics
    static_configs:
      - targets: ["blueprint-pushgateway:9091"]
