root = "."
tmp_dir = "temp/air-kafka-events"
[build]
  cmd = "go build -o ./temp/air-kafka-events/app ./cmd/kafka-events"
  entrypoint = ["./temp/air-kafka-events/app"]
  include_ext = ["go"]
  exclude_dir = ["temp", "bin", "docs", "deployments", "mocks", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "5s"
  send_interrupt = true
  stop_on_error = true
  rerun = true
  rerun_delay = 5000
[misc]
  clean_on_exit = true
